<ion-content class="ion-padding" [fullscreen]="true">
  <div class="login-container">
    <div class="login-header">
      <ion-icon name="car-sport" class="logo-icon"></ion-icon>
      <h1>Smart Parking Ambato</h1>
      <p>Localización, reserva y acceso a parqueaderos privados</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <ion-item>
        <ion-label position="floating">Correo o cédula</ion-label>
        <ion-input formControlName="identificador" type="text" autocomplete="username"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input formControlName="password" type="password" autocomplete="current-password"></ion-input>
      </ion-item>

      <ion-text color="danger" *ngIf="errorMensaje()">
        <p class="error-text">{{ errorMensaje() }}</p>
      </ion-text>

      <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="cargando()">
        <ion-spinner *ngIf="cargando()" name="crescent"></ion-spinner>
        <span *ngIf="!cargando()">Iniciar sesión</span>
      </ion-button>

      <ion-button expand="block" fill="clear" routerLink="/recuperar-password">
        ¿Olvidaste tu contraseña?
      </ion-button>
    </form>

    <div class="ion-text-center ion-margin-top">
      <ion-text color="medium">¿No tienes cuenta?</ion-text>
      <ion-button fill="clear" routerLink="/registro">Regístrate</ion-button>
    </div>
  </div>
</ion-content>
