<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Gestión de Personal</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="toggleFormulario()">
        <ion-icon slot="icon-only" [name]="mostrandoFormulario() ? 'close' : 'add'"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- ---------- FORMULARIO DE ALTA ---------- -->
  <form *ngIf="mostrandoFormulario()" [formGroup]="form" (ngSubmit)="onSubmit()" class="ion-margin-bottom">
    <ion-item>
      <ion-label position="floating">Nombre completo</ion-label>
      <ion-input formControlName="nombre"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Cédula</ion-label>
      <ion-input formControlName="cedula"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Correo</ion-label>
      <ion-input formControlName="correo" type="email"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Contraseña temporal</ion-label>
      <ion-input formControlName="password" type="password"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label>Rol</ion-label>
      <ion-select formControlName="rol" interface="popover">
        <ion-select-option value="operador">Operador</ion-select-option>
        <ion-select-option value="administrador">Administrador</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-text color="danger" *ngIf="errorMensaje()">
      <p class="error-text">{{ errorMensaje() }}</p>
    </ion-text>

    <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="enviando()">
      <ion-spinner *ngIf="enviando()" name="crescent"></ion-spinner>
      <span *ngIf="!enviando()">Crear usuario</span>
    </ion-button>
  </form>

  <!-- ---------- LISTA DE PERSONAL ---------- -->
  <div *ngIf="cargando()" class="centrado">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <ion-list *ngIf="!cargando()">
    <ion-item *ngFor="let usuario of usuarios()">
      <ion-label>
        <h2>{{ usuario.nombre }}</h2>
        <p>{{ usuario.correo }} — {{ usuario.rol }}</p>
      </ion-label>
      <ion-badge slot="end" [color]="usuario.activo ? 'success' : 'medium'" class="ion-margin-end">
        {{ usuario.activo ? 'Activo' : 'Inactivo' }}
      </ion-badge>
      <ion-toggle slot="end" [checked]="usuario.activo" (ionChange)="confirmarCambioEstado(usuario)"></ion-toggle>
    </ion-item>
  </ion-list>

</ion-content>
